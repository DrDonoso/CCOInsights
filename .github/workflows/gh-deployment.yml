name: "GitHub Deployment Workflow"

run-name: "GitHub Deployment: ${{ inputs.deployBaseName || github.repository_owner }} in ${{ inputs.location }} in ${{ inputs.resourceGroupName }}"

concurrency:
  group: ${{ github.ref }}-gh-deployment
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      location:
        type: string
        description: "Location where infrastructure will be deployed/updated"
        required: true
      resourceGroupName:
        type: string
        description: "Resource Group where infrastructure will be deployed/updated"
        required: true
        default: ""
      dataLakeName:
        type: string
        description: "DataLake Name"
        required: false
        default: "" 
      deployBaseName:
        type: string
        description: "Base name for deployment"
        required: false
        default: ""

  push:
    branches: [master, main]
    paths:
      - "dashboards/GitHubMetrics/infrastructure/deploy.bicep"
      - ".github/workflows/gh-deployment.yml"
      - "ghmetrics/**"

env:
  publishFolder: "publish"

jobs:
  check_changes:
    runs-on: ubuntu-latest
    name: "Check changes"
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check-infra
        name: "Check if infrastructure has changed"
        run: |
          if git diff --quiet HEAD^ HEAD -- dashboards/GitHubMetrics/infrastructure/deploy.bicep; then 
            echo "infraModified=false" >> $GITHUB_OUTPUT
          else 
            echo "infraModified=true" >> $GITHUB_OUTPUT
          fi

      - id: check-code
        name: "Check if code has changed"
        run: |
          if git diff --quiet HEAD^ HEAD -- ghmetrics/; then
            echo "codeModified=false" >> $GITHUB_OUTPUT
          else
            echo "codeModified=true" >> $GITHUB_OUTPUT
          fi 

      - id: results
        name: "Print results" 
        run: |
          echo "Infra modified: ${{ steps.check-infra.outputs.infraModified }}"
          echo "Code modified: ${{ steps.check-code.outputs.codeModified }}"
          echo "RGName: ${{ inputs.resourceGroupName }}"
    
    outputs: 
        infraModified: ${{ steps.check-infra.outputs.infraModified }} 
        codeModified: ${{ steps.check-code.outputs.codeModified }}

  deploy_infra:  
    name: Deploy infrastructure
    needs: check_changes
    runs-on: ubuntu-latest
    outputs:
      registryLoginServer: ${{ steps.set-output.outputs.registryLoginServer }}
    if: (needs.check_changes.outputs.infraModified == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Azure Login
        uses: Azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          enable-AzPSSession: true

      - name: Create Resource Group
        id: rg
        run: |
          resourceGroupName="${{ inputs.resourceGroupName }}"
          deployBaseName="${{ inputs.deployBaseName || github.repository_owner }}"

          if [ -z "$resourceGroupName" ]; then
            rgName="rg-${deployBaseName}-cco"
          else
            rgName="$resourceGroupName"
          fi

          az group create -n "$rgName" -l "${{ inputs.location }}"
          echo "resourceGroupName=$rgName" >> $GITHUB_OUTPUT

      - name: "Deploy infrastructure"
        id: deploy
        uses: azure/arm-deploy@v1
        with:
          deploymentName: ${{ steps.rg.outputs.resourceGroupName }}
          resourceGroupName: ${{ steps.rg.outputs.resourceGroupName }}
          template: ./dashboards/GitHubMetrics/infrastructure/main.bicep
          parameters: name=${{inputs.deployBaseName}} dlsname=${{ inputs.dataLakeName || '' }}
          failOnStderr: false # Remove when warnings are fixed

      - name: "Set output"
        id: set-output
        run: |
            # Fetching the output from Azure deployment using bash
            registryLoginServer=$(az deployment group show --resource-group "${{ steps.rg.outputs.resourceGroupName }}" --name "${{ steps.rg.outputs.resourceGroupName }}" --query 'properties.outputs.registryLoginServer.value' -o tsv)

            echo "RegistryLoginServer: $registryLoginServer"
            echo "registryLoginServer=$registryLoginServer" >> $GITHUB_OUTPUT

  code:
    name: Deploy code
    needs: [check_changes, deploy_infra]
    if: (needs.check_changes.outputs.codeModified == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Get Azure credentials"
        id: azure-credentials
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          echo "Retrieving spnAppId"
          client_id=$(echo "$AZURE_CREDENTIALS" | jq -r '.clientId')
          echo "clientId=$client_id" >> $GITHUB_OUTPUT

          echo "Retrieving client secret"
          clientSecret=$(echo "$AZURE_CREDENTIALS" | jq -r '.clientSecret')
          echo "clientSecret=$clientSecret" >> $GITHUB_OUTPUT

      - name: Login to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ needs.deploy_infra.outputs.registryLoginServer }}
          username: ${{ steps.azure-credentials.outputs.clientId }}
          password: ${{ steps.azure-credentials.outputs.clientSecret }}

      - name: Docker build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./ghmetrics/src/CCOInsights.GitHubMetrics/Dockerfile
          push: true
          tags: ${{ needs.deploy_infra.outputs.registryLoginServer }}/github-metrics:latest

